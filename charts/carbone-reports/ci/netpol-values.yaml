# NetworkPolicy, встроенные зависимости, внешний OnlyOffice, готовый Secret.
ingress:
  host: reports.example.com
existingSecret: carbone-reports
networkPolicy:
  enabled: true
postgresql:
  enabled: true
redis:
  enabled: true
s3:
  enabled: true
onlyoffice:
  enabled: false
  internalUrl: http://docs.example.com
