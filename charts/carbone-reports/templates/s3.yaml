{{- if .Values.s3.enabled }}
{{- $name := include "cr.component" (dict "root" . "name" "s3") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "cr.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3
data:
  # Копия docker/s3/entrypoint.sh (совпадение проверяет scripts/chart.sh files).
  entrypoint.sh: |
    {{- .Files.Get "files/s3-entrypoint.sh" | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "cr.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "cr.selectorLabels" (dict "root" . "component" "s3") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cr.selectorLabels" (dict "root" . "component" "s3") | nindent 8 }}
      annotations:
        checksum/entrypoint: {{ .Files.Get "files/s3-entrypoint.sh" | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.s3.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "cr.podDefaults" . | nindent 6 }}
      containers:
        - name: s3
          image: {{ .Values.s3.image }}
          command: [/s3-entrypoint.sh]
          env:
            {{- include "cr.secretEnv" (dict "root" . "env" "S3_ACCESS_KEY_ID" "key" "S3_ACCESS_KEY_ID") | nindent 12 }}
            {{- include "cr.secretEnv" (dict "root" . "env" "S3_SECRET_ACCESS_KEY" "key" "S3_SECRET_ACCESS_KEY") | nindent 12 }}
            {{- with .Values.s3.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: s3
              containerPort: 8333
          # Первый запуск (создание бакета) на медленном узле: liveness включается после startupProbe.
          startupProbe:
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: entrypoint
              mountPath: /s3-entrypoint.sh
              subPath: entrypoint.sh
            - name: data
              mountPath: /data
          {{- with .Values.s3.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: entrypoint
          configMap:
            name: {{ $name }}
            defaultMode: 0555
      {{- include "cr.scheduling" .Values.s3 | nindent 6 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.s3.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.s3.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "cr.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3
spec:
  selector:
    {{- include "cr.selectorLabels" (dict "root" . "component" "s3") | nindent 4 }}
  ports:
    - name: s3
      port: 8333
      targetPort: s3
{{- end }}
