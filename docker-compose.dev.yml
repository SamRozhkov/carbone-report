services:
  web:
    ports: !override
      - '127.0.0.1:${WEB_DEV_PORT:-8080}:80'
    volumes: !override []
    environment:
      NGINX_MODE: dev

  api:
    image: carbone-reports-api:dev
    build:
      target: dev
    working_dir: /repo
    environment:
      COOKIE_SECURE: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/repo
      - dev_node_modules:/repo/node_modules
      - dev_api_node_modules:/repo/apps/api/node_modules
      - dev_shared_node_modules:/repo/packages/shared/node_modules
      - dev_carbone_node_modules:/repo/packages/carbone/node_modules
      - dev_pnpm_store:/pnpm/store
    healthcheck:
      start_period: 240s
      retries: 30

  postgres:
    ports:
      - '127.0.0.1:${POSTGRES_DEV_PORT:-55433}:5432'

volumes:
  dev_node_modules:
  dev_api_node_modules:
  dev_shared_node_modules:
  dev_carbone_node_modules:
  dev_pnpm_store:
