name: carbone-reports

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Хранилище файлов API и бэкапа: SeaweedFS (сервис s3) во внутренней сети s3; бакет S3_BUCKET создаёт API.
x-s3-env: &s3-env
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://s3:8333
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-carbone-reports}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?задайте S3_ACCESS_KEY_ID в .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?задайте S3_SECRET_ACCESS_KEY в .env}
  S3_FORCE_PATH_STYLE: 'true'

services:
  web:
    image: ${WEB_IMAGE:-carbone-reports-web}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '${WEB_HTTP_PORT:-80}:80'
      - '${WEB_HTTPS_PORT:-443}:443'
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
      onlyoffice:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  api:
    image: ${API_IMAGE:-carbone-reports-api}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/app
      APP_SECRET: ${APP_SECRET:?задайте APP_SECRET в .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?задайте ENCRYPTION_KEY в .env}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?задайте ONLYOFFICE_JWT_SECRET в .env}
      ADMIN_LOGIN: ${ADMIN_LOGIN:?задайте ADMIN_LOGIN в .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      API_INTERNAL_URL: http://api:3000
      CARBONE_URL: http://carbone:4000
      REDIS_URL: redis://:${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}@redis:6379
      <<: *s3-env
      S3_CREATE_BUCKET: 'true'
      COOKIE_SECURE: 'true'
      TZ: ${TZ:-Europe/Moscow}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-30000}
      QUERY_MAX_ROWS: ${QUERY_MAX_ROWS:-100000}
      RENDER_TIMEOUT_MS: ${RENDER_TIMEOUT_MS:-120000}
      REPORT_TIMEOUT_MS: ${REPORT_TIMEOUT_MS:-120000}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-30}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(uid=%s)}
      LDAP_DEFAULT_ROLE: ${LDAP_DEFAULT_ROLE:-user}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
    volumes:
      - storage:/data
    networks: [default, cache]
    networks: [default, cache, s3]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      carbone:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    # Пароль подставляет shell внутри контейнера, поэтому его нет в команде (docker inspect).
    # Не-hex пароль ломает REDIS_URL у api: контейнер выходит с кодом 1 до запуска сервера.
    command:
      [
        'sh',
        '-c',
        'case "$$REDIS_PASSWORD" in ""|*[!0-9a-fA-F]*) echo "REDIS_PASSWORD: только шестнадцатеричные символы (openssl rand -hex 32)" >&2; exit 1;; esac; exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy volatile-lru',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}
      # redis-cli в контейнере (healthcheck, restore.sh) берёт пароль отсюда.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?задайте REDIS_PASSWORD в .env}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    # Только внутренняя сеть cache: Redis доступен одному api.
    networks: [cache]
    logging: *logging
    restart: unless-stopped

  demo-db:
    image: postgres:17-alpine
    profiles: [demo]
    environment:
      POSTGRES_USER: demo_owner
      # Пустое значение не мешает прод-стеку без профиля demo; сам demo-db без пароля не стартует.
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-}
      POSTGRES_DB: demo
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:-}
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
      - ./demo/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U demo_owner -d demo']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  carbone:
    image: carbone/carbone-ee:full-5.15.3-fonts
    volumes:
      - carbone_templates:/app/template
    restart: unless-stopped
    logging: *logging

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?задайте ONLYOFFICE_JWT_SECRET в .env}
      JWT_HEADER: Authorization
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
    volumes:
      - oo_data:/var/www/onlyoffice/Data
      - oo_lib:/var/lib/onlyoffice
      - oo_logs:/var/log/onlyoffice
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost/healthcheck | grep -q true']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    logging: *logging

  s3:
    # Официальный образ SeaweedFS: master, volume, filer и S3-шлюз в одном процессе (weed mini).
    # docker/s3/entrypoint.sh создаёт учётную запись S3 из S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY
    # и включает только S3 (без WebDAV, Admin UI, IAM, Iceberg; без автосоздания бакетов).
    image: chrislusf/seaweedfs:4.48
    entrypoint: ['/s3-entrypoint.sh']
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?задайте S3_ACCESS_KEY_ID в .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?задайте S3_SECRET_ACCESS_KEY в .env}
    volumes:
      - ./docker/s3/entrypoint.sh:/s3-entrypoint.sh:ro
      - s3_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    # Только внутренняя сеть s3: хранилище доступно api и backup, порты наружу не публикуются.
    networks: [s3]
    restart: unless-stopped
    logging: *logging

  backup:
    image: ${BACKUP_IMAGE:-carbone-reports-backup}
    # postgres:17-alpine + rclone (режим s3); скрипты монтируются из docker/backup.
    build:
      context: ./docker/backup
    profiles: [backup]
    entrypoint: ['/backup/entrypoint.sh']
    command: ['cron']
    environment:
      <<: *s3-env
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_TIMEOUT: ${BACKUP_TIMEOUT:-3600}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./docker/backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
    networks: [default, s3]
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

networks:
  # Внутренние сети без выхода наружу: cache — api и redis; s3 — api, backup и s3.
  cache:
    internal: true
  s3:
    internal: true

# Прежний том storage (файлы до Плана 14) больше не объявлен и не монтируется: после переноса
# в SeaweedFS (README, «Файлы в S3-хранилище») его можно удалить вручную; restore.sh находит его по меткам.
volumes:
  pgdata:
  demo_pgdata:
  s3_data:
  carbone_templates:
  oo_data:
  oo_lib:
  oo_logs:
