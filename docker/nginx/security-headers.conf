# Подключается в location статики: add_header внутри location отменяет наследование из server,
# поэтому HSTS передаётся переменной $hsts (в dev пустая — заголовок не отправляется).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security $hsts always;
# Report-Only до E2E в настоящем браузере (План 3): OnlyOffice и Monaco должны работать без нарушений.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
