# NGINX_MODE=http (чарт Helm): TLS завершает Ingress, nginx слушает только 80 без редиректа.
# HSTS отдаётся, как при TLS на nginx: браузер видит https-адрес Ingress.
server {
    listen 80;
    server_name _;

    add_header Strict-Transport-Security "max-age=31536000" always;

    set $hsts "max-age=31536000";

    # TLS завершает Ingress: схему клиента берём из его X-Forwarded-Proto, иначе OnlyOffice
    # построит http:// адреса на https-странице.
    set $fwd_proto $scheme;
    if ($http_x_forwarded_proto != "") { set $fwd_proto $http_x_forwarded_proto; }
    include /etc/nginx/snippets/common.conf;
}
