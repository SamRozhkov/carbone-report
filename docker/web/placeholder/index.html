<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carbone Reports</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #1f2329;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #5c6370;
        line-height: 1.5;
      }
      code {
        background: #e9ebef;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Carbone Reports</h1>
      <p>Интерфейс ещё в разработке. API доступен по адресу <code>/api</code>.</p>
      <p id="status">Проверяем API…</p>
    </main>
    <script>
      fetch('/api/health')
        .then((r) => r.json())
        .then((b) => {
          document.getElementById('status').textContent =
            b.status === 'ok' ? 'API работает.' : 'API отвечает с ошибкой.';
        })
        .catch(() => {
          document.getElementById('status').textContent = 'API недоступен.';
        });
    </script>
  </body>
</html>
